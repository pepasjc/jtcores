include:
  - core: sbaskt
    file: audio.yaml
params:
  - { name: SCR_OFFSET, value: "`SCR_START >> 1" }
  - { name: OBJ_OFFSET, value: "`OBJ_START >> 1" }
  - { name: PCM_OFFSET, value: "`PCM_START >> 1" }
  - { name: SND_OFFSET, value: "`SND_START >> 1" }
clocks:
  clk24:
    - mul: 1
      div: 4
      outputs:
        - cpu4
        - ti1
        - ti2
    - freq: 3579545
      outputs:
        - snd
        - psg
download:
  post_addr: true
  post_data: true
# RetroAchievements tap driven by jtroadf_main (6809 work RAM)
ports:
  - { name: ra_game_addr, msb: 15 }
  - { name: ra_game_din,  msb: 15 }
  - { name: ra_game_we,   msb: 1 }
sdram:
  banks:
    - buses:
        - name: scr
          addr_width: 16
          data_width: 32
          offset: SCR_OFFSET
          cs: LVBL
        - name: objrom
          addr_width: 16
          data_width: 32
          offset: OBJ_OFFSET
        - name: pcm
          addr_width: 16
          data_width: 8
          offset: PCM_OFFSET
        - name: snd
          addr_width: 14
          data_width: 8
          offset: SND_OFFSET
        - name: main
          addr_width: 16
          data_width: 8